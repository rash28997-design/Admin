here<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম অ্যাডমিন প্যানেল</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Noto Sans Bengali', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- Login Screen -->
    <div id="admin-login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 border">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-2">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1 class="text-xl font-bold">অ্যাডমিন প্যানেল লগইন</h1>
            </div>
            <form onsubmit="adminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1">জিমেইল *</label>
                    <input type="email" id="admin-email" required placeholder="admin43214@gmail.com" class="w-full border rounded-xl p-3 text-xs outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">পাসওয়ার্ড *</label>
                    <input type="password" id="admin-pass" required placeholder="পাসওয়ার্ড দিন" class="w-full border rounded-xl p-3 text-xs outline-none focus:ring-2 focus:ring-indigo-600">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-xs uppercase shadow-lg hover:bg-indigo-700 transition">লগইন করুন</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="admin-dashboard" class="hidden min-h-screen pb-10">
        <header class="bg-indigo-900 text-white shadow-md">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="font-bold text-base"><i class="fas fa-gauge text-orange-400 mr-2"></i>ই-শপ অ্যাডমিন ড্যাশবোর্ড</h1>
                <button onclick="adminLogout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition"><i class="fas fa-sign-out-alt mr-1"></i> লগআউট</button>
            </div>
        </header>

        <div class="container mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Add Product Form -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border h-fit">
                <h2 id="form-title" class="text-sm font-bold border-b pb-2 mb-4 text-indigo-600"><i class="fas fa-plus-circle mr-1"></i> নতুন পণ্য যুক্ত করুন</h2>
                <form onsubmit="handleProductSubmit(event)" class="space-y-3">
                    <input type="hidden" id="edit-prod-id">
                    <div>
                        <label class="block text-[11px] font-semibold mb-1">পণ্যের আইডি/কোড *</label>
                        <input type="text" id="p-code" required placeholder="PROD-101" class="w-full border rounded-lg p-2.5 text-xs font-bold focus:ring-1 focus:ring-indigo-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold mb-1">পণ্যের নাম *</label>
                        <input type="text" id="p-name" required placeholder="পণ্যের নাম" class="w-full border rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-indigo-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold mb-1">মূল্য (টাকা) *</label>
                        <input type="number" id="p-price" required placeholder="১২০০" class="w-full border rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-indigo-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold mb-1">ছবির লিংক/ফাইল *</label>
                        <input type="file" id="p-img-file" accept="image/*" class="w-full border rounded-lg p-2 text-xs bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold mb-1">ক্যাটাগরি *</label>
                        <select id="p-cat" class="w-full border rounded-lg p-2.5 text-xs">
                            <option value="mobile">মোবাইল</option>
                            <option value="fashion">ফ্যাশন</option>
                            <option value="gadget">গ্যাজেট</option>
                            <option value="watch">ঘড়ি</option>
                            <option value="others">অন্যান্য</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold mb-1">বিবরণ *</label>
                        <textarea id="p-desc" required rows="2" class="w-full border rounded-lg p-2.5 text-xs focus:ring-1 focus:ring-indigo-600"></textarea>
                    </div>
                    <button type="submit" id="save-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-xs uppercase shadow-md transition">পাবলিশ করুন</button>
                </form>

                <div class="mt-8 border-t pt-4">
                    <h3 class="text-xs font-bold mb-3">প্রকাশিত পণ্যসমূহ (<span id="product-count">০</span>)</h3>
                    <div id="published-products-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>
            </div>

            <!-- Orders Management -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border lg:col-span-2">
                <div class="border-b pb-3 mb-4 flex justify-between items-center">
                    <h2 class="text-sm font-bold text-indigo-600 flex items-center gap-2">
                        <i class="fas fa-shopping-bag"></i> 
                        কাস্টমার অর্ডারসমূহ (<span id="order-count">০</span>)
                    </h2>
                    <button onclick="loadAdminOrders()" class="text-xs text-indigo-600 hover:underline font-bold"><i class="fas fa-rotate mr-1"></i> রিফ্রেশ</button>
                </div>
                <div id="admin-orders-container" class="space-y-4 overflow-y-auto max-h-[700px] pr-1"></div>
            </div>

        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBWkT-C2CEJRTcgZoAVx1Bcxrx0zMCxTtA",
            authDomain: "my-eshop-app-e65ec.firebaseapp.com",
            projectId: "my-eshop-app-e65ec",
            storageBucket: "my-eshop-app-e65ec.firebasestorage.app",
            messagingSenderId: "92808609246",
            appId: "1:92808609246:web:4b818a50e85633dac7f14f"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let products = [];
        let orders = [];

        // Realtime Listener for Products
        db.ref('products').on('value', (snapshot) => {
            products = snapshot.val() ? Object.values(snapshot.val()) : [];
            loadPublishedProducts();
        });

        // Realtime Listener for Orders
        db.ref('orders').on('value', (snapshot) => {
            orders = snapshot.val() ? Object.values(snapshot.val()) : [];
            loadAdminOrders();
        });

        function adminLogin(e) {
            e.preventDefault();
            // এখানে পাসওয়ার্ড পরিবর্তন করে 'Eshop@Admin#2026' দেওয়া হয়েছে। আপনি চাইলে আপনার পছন্দমতো যেকোনো পাসওয়ার্ড বসিয়ে নিতে পারেন।
            if(document.getElementById('admin-email').value === 'admin43214@gmail.com' && document.getElementById('admin-pass').value === 'Eshop@Admin#2026') {
                localStorage.setItem('is_admin_logged', 'true');
                document.getElementById('admin-login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            } else { alert('ভুল জিমেইল বা পাসওয়ার্ড!'); }
        }

        function adminLogout() {
            localStorage.removeItem('is_admin_logged');
            location.reload();
        }

        window.onload = function() {
            if(localStorage.getItem('is_admin_logged') === 'true') {
                document.getElementById('admin-login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            }
        }

        function handleProductSubmit(e) {
            e.preventDefault();
            const file = document.getElementById('p-img-file').files[0];
            if(!file) { alert('ছবি দিন!'); return; }
            const reader = new FileReader();
            reader.onload = function(event) {
                const prodId = Date.now();
                const newProduct = {
                    id: prodId,
                    code: document.getElementById('p-code').value,
                    name: document.getElementById('p-name').value,
                    price: Number(document.getElementById('p-price').value),
                    img: event.target.result,
                    category: document.getElementById('p-cat').value,
                    desc: document.getElementById('p-desc').value
                };
                db.ref('products/' + prodId).set(newProduct);
                alert('পণ্য সফলভাবে প্রকাশ করা হয়েছে!');
                e.target.reset();
            };
            reader.readAsDataURL(file);
        }

        function loadPublishedProducts() {
            const list = document.getElementById('published-products-list');
            document.getElementById('product-count').innerText = products.length;
            list.innerHTML = products.length === 0 ? '<p class="text-gray-400 text-xs text-center">কোনো পণ্য নেই</p>' : '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg border text-xs">
                        <div class="flex items-center space-x-2">
                            <img src="${p.img}" class="w-8 h-8 object-cover rounded">
                            <div>
                                <p class="font-bold">${p.name}</p>
                                <p class="text-[10px] text-gray-500">আইডি: ${p.code || 'N/A'} | ৳${p.price}</p>
                            </div>
                        </div>
                        <button onclick="db.ref('products/${p.id}').remove()" class="bg-red-100 hover:bg-red-200 text-red-600 px-2 py-1 rounded font-bold transition">ডিলিট</button>
                    </div>
                `;
            });
        }

        /* CUSTOMER ORDERS DISPLAY - SERIAL BY SERIAL WITH COMPLETE DETAILS */
        function loadAdminOrders() {
            const container = document.getElementById('admin-orders-container');
            document.getElementById('order-count').innerText = orders.length;
            
            if (orders.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 text-xs py-8">বর্তমানে কোনো অর্ডার নেই!</p>';
                return;
            }

            container.innerHTML = '';

            orders.forEach((ord, index) => {
                let itemsHtml = '';
                let orderTotal = 0;

                // Loop through items in order
                if (ord.items && ord.items.length > 0) {
                    ord.items.forEach((item, itemIdx) => {
                        const itemSubtotal = (item.price || 0) * (item.qty || 1);
                        orderTotal += itemSubtotal;
                        itemsHtml += `
                            <tr class="border-b text-[11px] text-gray-700">
                                <td class="py-1.5 px-2 text-center font-bold">${itemIdx + 1}</td>
                                <td class="py-1.5 px-2 font-semibold">${item.name}</td>
                                <td class="py-1.5 px-2 text-center bg-indigo-50 font-bold text-indigo-700">${item.code || 'N/A'}</td>
                                <td class="py-1.5 px-2 text-center">৳ ${item.price}</td>
                                <td class="py-1.5 px-2 text-center font-bold">${item.qty}</td>
                                <td class="py-1.5 px-2 text-right font-bold text-orange-600">৳ ${itemSubtotal}</td>
                            </tr>
                        `;
                    });
                } else {
                    itemsHtml = `<tr><td colspan="6" class="text-center py-2 text-red-500 text-xs">কোন পণ্য তথ্য পাওয়া যায়নি!</td></tr>`;
                }

                // Daraz-style Status Badge Color
                let statusBg = 'bg-yellow-100 text-yellow-800 border-yellow-300';
                if (ord.status.includes('সম্পন্ন') || ord.status.includes('Delivered')) {
                    statusBg = 'bg-green-100 text-green-800 border-green-300';
                } else if (ord.status.includes('বাতিল') || ord.status.includes('Cancelled')) {
                    statusBg = 'bg-red-100 text-red-800 border-red-300';
                } else if (ord.status.includes('শিপিং') || ord.status.includes('প্যাকেজিং')) {
                    statusBg = 'bg-blue-100 text-blue-800 border-blue-300';
                }

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-xl border-2 border-indigo-100 shadow-sm text-xs space-y-3">
                        
                        <!-- Order Header Info -->
                        <div class="flex flex-wrap justify-between items-center border-b pb-2 gap-2 bg-indigo-50/50 p-2 rounded-lg">
                            <div>
                                <span class="font-extrabold text-indigo-900 text-sm">সিরিয়াল #${index + 1}</span>
                                <span class="ml-2 font-bold bg-white text-gray-800 px-2 py-0.5 rounded border text-[11px]">অর্ডার ID: ${ord.id}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] text-gray-500 font-semibold">${ord.orderDate || 'তারিখ N/A'}</span>
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${statusBg}">
                                    ${ord.status}
                                </span>
                            </div>
                        </div>

                        <!-- Ordered Items Table -->
                        <div>
                            <p class="font-bold text-gray-800 mb-1 flex items-center gap-1">
                                <i class="fas fa-boxes-packing text-orange-500"></i> অড্যারকৃত পণ্যের তালিকা:
                            </p>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse border rounded-lg overflow-hidden">
                                    <thead>
                                        <tr class="bg-gray-100 text-[10px] font-bold text-gray-700 border-b">
                                            <th class="p-1.5 text-center">নং</th>
                                            <th class="p-1.5">পণ্যের নাম</th>
                                            <th class="p-1.5 text-center">আইডি/কোড</th>
                                            <th class="p-1.5 text-center">একক মূল্য</th>
                                            <th class="p-1.5 text-center">পরিমাণ</th>
                                            <th class="p-1.5 text-right">মোট</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${itemsHtml}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Customer Details Serial By Serial -->
                        <div class="bg-gray-50 p-3 rounded-lg border space-y-1 text-gray-800">
                            <p class="font-bold border-b pb-1 mb-2 text-indigo-700 flex items-center gap-1">
                                <i class="fas fa-user-tag text-xs"></i> কাস্টমারের সম্পূর্ণ ঠিকানা ও তথ্য:
                            </p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1">
                                <p><strong>১. নাম:</strong> ${ord.name || 'N/A'}</p>
                                <p><strong>২. মোবাইল নম্বর:</strong> <a href="tel:${ord.phone}" class="text-indigo-600 font-bold hover:underline">${ord.phone || 'N/A'}</a></p>
                                <p><strong>৩. জেলা:</strong> ${ord.district || 'N/A'}</p>
                                <p><strong>৪. থানা / উপজেলা:</strong> ${ord.thana || 'N/A'}</p>
                                <p><strong>৫. ইউনিয়ন / ওয়ার্ড:</strong> ${ord.union || 'N/A'}</p>
                                <p><strong>৬. গ্রাম / মহডা / রোড:</strong> ${ord.village || ord.address || 'N/A'}</p>
                                <p><strong>৭. পেমেন্ট মেথড:</strong> <span class="uppercase font-bold text-indigo-600">${ord.payment || 'COD'}</span></p>
                                <p><strong>৮. ট্রানজ্যাকশন ID (TrxID):</strong> <span class="font-mono font-bold bg-yellow-100 px-1 rounded">${ord.trx || 'N/A'}</span></p>
                            </div>
                        </div>

                        <!-- Status Management and Delete -->
                        <div class="flex flex-wrap justify-between items-center pt-2 border-t gap-2">
                            <div class="flex items-center space-x-2">
                                <label class="font-bold text-[11px] text-gray-700">স্ট্যাটাস আপডেট:</label>
                                <select onchange="updateOrderStatus('${ord.id}', this.value)" class="border p-1.5 rounded-lg font-semibold bg-white text-xs outline-none focus:ring-1 focus:ring-indigo-600">
                                    <option value="প্রক্রিয়াধীন (Processing)" ${ord.status.includes('প্রক্রিয়াধীন') ? 'selected' : ''}>১. প্রক্রিয়াধীন (Processing)</option>
                                    <option value="প্যাকেজিং হচ্ছে (Packaging)" ${ord.status.includes('প্যাকেজিং') ? 'selected' : ''}>২. প্যাকেজিং হচ্ছে (Packaging)</option>
                                    <option value="শিপিং করা হয়েছে (Shipped)" ${ord.status.includes('শিপিং') ? 'selected' : ''}>৩. শিপিং করা হয়েছে (Shipped)</option>
                                    <option value="আউট ফর ডেলিভারি (Out for Delivery)" ${ord.status.includes('আউট') ? 'selected' : ''}>৪. আউট ফর ডেলিভারি (Out for Delivery)</option>
                                    <option value="ডেলিভারি সম্পন্ন (Delivered)" ${ord.status.includes('সম্পন্ন') ? 'selected' : ''}>৫. ডেলিভারি সম্পন্ন (Delivered)</option>
                                    <option value="বাতিল (Cancelled)" ${ord.status.includes('বাতিল') ? 'selected' : ''}>৬. বাতিল (Cancelled)</option>
                                </select>
                            </div>
                            
                            <button onclick="deleteOrder('${ord.id}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs transition flex items-center gap-1">
                                <i class="fas fa-trash-can"></i> অর্ডার ডিলিট
                            </button>
                        </div>

                    </div>
                `;
            });
        }

        // Update Order Status in Realtime Firebase Database
        function updateOrderStatus(orderId, newStatus) {
            db.ref('orders/' + orderId).update({ status: newStatus }, (error) => {
                if(!error) {
                    alert('অর্ডার স্ট্যাটাস আপডেট করা হয়েছে!');
                } else {
                    alert('স্ট্যাটাস আপডেট ব্যর্থ হয়েছে!');
                }
            });
        }

        // Delete Order
        function deleteOrder(orderId) {
            if(confirm('আপনি কি নিশ্চিত যে এই অর্ডারটি মুছে ফেলতে চান?')) {
                db.ref('orders/' + orderId).remove();
            }
        }
    </script>
</body>
</html>
